# Inglese britannico di nomi e descrizioni delle ricette e delle quantità a parole.
# Partito dal prototipo (prototype/scripts/demo-translations.en-GB.json), ricontrollato contro le righe.
recipes:
  wok-pollo-peperoni-riso-basmati:
    name: Chicken stir-fry with peppers, carrots and courgettes; basmati rice
    description: Cook the rice, stir-fry the chicken and vegetables in the wok, then combine and season.
  pasta-melanzane-pomodoro-ricotta:
    name: Classic pasta with fresh tomato, aubergine and ricotta
    description: Brown the aubergine, add the tomato and stir the pasta through with the ricotta.
  frittata-forno-bietole-ricotta:
    name: Baked frittata with chard and ricotta; tomato salad
    description: Mix eggs, chard and ricotta, bake in the oven and serve with the tomatoes.
  noodles-wok-uova-verdure:
    name: Wok noodles with egg, carrots, courgettes and peas
    description: Stir-fry the vegetables, add the eggs and noodles and season with soy sauce.
  merluzzo-pomodoro-olive-cous-cous:
    name: Cod fillets with tomato and olives; couscous and broccoli
    description: Cook the cod with tomato, spring onion and Taggiasca olives and serve with saffron couscous and almonds.
  wrap-frittata-hummus:
    name: Wraps with frittata, hummus, lettuce and carrots
    description: Blend chickpeas, tahini, lemon and garlic for a spicy hummus, then fill the flatbreads with vegetables and Emmental.
  gamberi-zucchine-skottle:
    name: Skottle prawns and courgettes with toasted bread and cherry tomatoes
    description: Brown the prawns and courgettes with garlic and shallot, deglaze with white wine and serve on toasted bread.
  uova-pomodoro-padella:
    name: Eggs in tomato sauce
    description: Soften the onion, cook the cherry tomatoes for 5 min, add the eggs and finish covered.
  polpette-melanzane-forno:
    name: Baked aubergine balls
    description: Brown the diced aubergine, mix with egg, breadcrumbs and caciocavallo, bake for 40 min.
  pappardelle-alfredo:
    name: Pappardelle Alfredo
    description: Melt the butter, add half the Parmesan and some pasta water, then stir in the rest of the Parmesan.
  pasta-pesto-genovese:
    name: Pasta with Genoese pesto
    description: Cook the pasta and dress it with a jar of ready-made Genoese pesto.
  hamburger-cavallo:
    name: Horse meat burgers
    description: Cook the horse meat burgers and serve them in buns.
  pasta-tonno:
    name: Tuna pasta
    description: Fry garlic and anchovies, add drained tuna and tomato, then finish with parsley and basil.
  spaghetti-pomodoro:
    name: Spaghetti with tomato sauce
    description: Fry the garlic, add the tomato and basil, then stir in Parmesan to taste.
  pasta-sugo-pesce:
    name: Pasta with fish sauce
    description: Fry garlic and anchovies, add the fish sauce and stir through the fresh pasta.
  penne-baffo:
    name: Penne al baffo
    description: Brown the ham, add crushed peeled tomatoes and cream, then stir the penne through with parsley.
  pasta-zucca-salsiccia-robiola:
    name: Pasta with squash, sausage and robiola
    description: Brown the sausage and onion, cook the squash for 10 min, stir through with robiola and pasta water.
  orecchiette-broccoli:
    name: Orecchiette with broccoli
    description: Boil the broccoli, fry garlic and anchovies, then blend everything and stir the pasta through with Parmesan to taste.
  pasta-crema-peperoni:
    name: Pasta with creamy pepper sauce
    description: Stew the peppers with onion, blend with ricotta and milk and coat the paccheri with the sauce.
  bistecche-tonno-skottle:
    name: Skottle tuna steaks
    description: Marinate the tuna with oil, lemon and spices, then cook on the skottle over high heat for 3 minutes per side.
  branzino-barbecue:
    name: Barbecued sea bass fillets
    description: Cook the sea bass fillets skin side first, 3 minutes per side, with oil, salt and pepper.
  sovracosce-pollo-griglia:
    name: Grilled chicken thighs
    description: Marinate the thighs with oil, lemon and spices for 6 hours, then barbecue for 4 minutes per side.
  burrito-vegan:
    name: Vegan burrito
    description: Warm the vegan strips, fill the bread with beans, guacamole, sweet potato and sweetcorn and roll up.
  caviale-melanzane-panino:
    name: Sandwich with aubergine caviar, grilled vegetables and feta
    description: Fill Lebanese bread with aubergine caviar, grilled vegetables, feta, pickles, raisins and coriander.
  riso-curry-giappone:
    name: Japanese curry rice with minced pork and pepper
    description: Cook the rice first; in the wok brown the pork, onion and pepper, add the curry and serve over the rice.
  omelette-spinaci-montasio:
    name: Spinach and Montasio omelette
    description: Cook the eggs in a pan, fill with baby spinach and Montasio and fold over.
  straccetti-pollo-limone:
    name: Lemon chicken strips
    description: Brown the floured chicken strips with garlic, then add lemon, water and herbs.
  riso-lenticchie-zucca:
    name: Rice with lentils and squash
    description: Cook the diced squash with garlic and water, then add cooked lentils and rice.
  riso-wok-broccoli-gamberi:
    name: Wok-fried rice with broccoli and prawns
    description: Blanch the broccoli; stir-fry prawns and ginger in the wok, then add cooked rice and soy sauce.
  riso-cantonese-casa:
    name: Home-style Cantonese rice
    description: Dice the vegetables, beat the eggs, cook the rice and stir-fry everything in the wok with soy sauce.
  zuppa-fagioli-veloce-guanciale:
    name: Quick bean soup with crispy guanciale
    description: Brown the guanciale, soften the red onion, add beans and stock and serve topped with the crispy guanciale.
  piadine-pollo-hummus-carote:
    name: Flatbreads with hummus, chicken, carrots and salad
    description: Warm the flatbreads, spread with hummus and fill with chicken, carrots and salad.
  orata-padella-patate-pomodorini:
    name: Pan-cooked sea bream fillets with potatoes and cherry tomatoes
    description: Brown cherry tomatoes and very thinly sliced potatoes, lay the fillets on top, deglaze with wine and cook covered.
  lonza-maiale-limone:
    name: Lemon pork loin slices
    description: Pound and flour the slices, brown them with butter, garlic and lemon zest, then deglaze with lemon and honey.
  fettine-pizzaiola-prezzemolo:
    name: Beef slices pizzaiola with parsley
    description: Brown the slices with garlic, cook them covered in blended tomato and finish with parsley.
  lenticchie-comidista:
    name: Spanish-style lentils (El Comidista)
    description: Cook the lentils with half an onion, garlic and bay leaf, add potato and carrots, then blend the sofrito with paprika and cumin and stir it in.
  pasta-robiola-speck:
    name: Pasta with robiola and speck
    description: Brown the diced speck, soften the spring onion in the same pan and stir the pasta through with robiola and pasta water.
  pasta-ricotta-zafferano:
    name: Creamy ricotta and saffron pasta
    description: Loosen the ricotta with saffron and pasta water, dress the spaghettoni and finish with pepper and sage.
  couscous-verdure-tonno:
    name: Couscous with vegetables and tuna
    description: Soak the couscous, stir-fry carrots, pepper and courgette, add tuna, kidney beans and soy sauce and finish with radishes and parsley.
  couscous-verdure:
    name: Vegetable couscous
    description: Stir-fry aubergines, peppers, carrots, courgettes and peas, then combine with turmeric couscous and finish with basil and almonds.
  pappardelle-salsiccia-porri:
    name: Rustic pappardelle with sausage and leeks
    description: Brown the sausage with chilli and thyme, deglaze with red wine, add the leek and toss the pappardelle with Parmesan.
  pollo-corn-flakes:
    name: Cornflake-crusted chicken breast
    description: Coat the chicken slices in flour, egg and paprika cornflakes, fry them and serve with a yoghurt, mayonnaise and lemon sauce.
  piadine-bresaola-stracchino-pesto-rosso:
    name: Flatbreads with bresaola, stracchino and red pesto
    description: Blend sun-dried tomatoes, almonds and basil; fill with bresaola, stracchino and rocket and warm in a pan.
  riso-ceci-spinaci-mandorle:
    name: Turmeric rice with chickpeas and spinach
    description: Cook the basmati with turmeric; stir-fry chickpeas and spinach with tomatoes, stock and almond butter, then serve over the rice.
  spaghetti-riso-tofu-verdure-wok:
    name: Wok rice noodles with tofu and vegetables
    description: Stir-fry vegetables and smoked tofu, add the rice noodles and season with soy, barbecue sauce and sesame.
  paccheri-radicchio-bresaola-ricotta-noci:
    name: Paccheri with radicchio and bresaola
    description: "Adapted version: wilt the radicchio, stir through with ricotta and finish with bresaola and walnuts."
  ditali-cremosi-zucca-ceci:
    name: Creamy ditali with squash and chickpeas
    description: "Adapted version: cook the squash with sage and rosemary, blend part of it and add cooked chickpeas and ditali."
  trofie-funghi-piselli-ricotta:
    name: Trofie with mushrooms, peas and ricotta
    description: "Adapted version: brown the mushrooms, add the peas and stir the pasta through with ricotta, pasta water and parsley."
  fusilli-ricotta-spinaci-noci:
    name: Fusilli with ricotta and spinach
    description: "Adapted version: wilt the spinach, blend with ricotta and pasta water, dress the fusilli and finish with walnuts and lemon."
  wrap-fagioli-neri-cheddar:
    name: Black bean and cheddar wraps
    description: Fry the beans with onion and garlic; fill the tortillas with cheddar, lettuce, tomato, yoghurt sauce and Mexican salsa.
  erbazzone-uova-strapazzate-stracchino:
    name: Erbazzone, scrambled eggs and stracchino
    description: Bake the erbazzone following the packet; make the scrambled eggs and serve with the stracchino.
  sandwich-uova-mozzarella-pomodoro-tacchino:
    name: Egg, mozzarella, tomato and turkey sandwich
    description: Fried eggs and mozzarella in the first layer; mayonnaise, tomato and turkey in the second. Three slices of bread each.
  salmone-skottle-fagiolini-patate:
    name: Skottle salmon fillets with lemon and herbs; green beans and potatoes
    description: Cook the fillets on the skottle and serve with green beans and sautéed potatoes.
  polpettine-tacchino-skottle:
    name: Skottle turkey patties with peppers and courgettes; bread
    description: Shape flattened patties and cook them on the skottle with the vegetables.
  insalata-farro-tonno:
    name: Spelt salad with tuna, tomatoes, cucumber, sweetcorn and olives
    description: Mix the cooked spelt with the tuna and vegetables, then dress.
  crema-zucchine-cannellini:
    name: Courgette and cannellini soup with croutons and cherry tomatoes
    description: Blend courgettes, cannellini and tahini with garlic and lemon; finish with basil, parsley and chives.
quantities:
  1 bustina: 1 sachet
  1/2 bicchiere: 1/2 glass
  1 mazzetto: 1 bunch
  15 cucchiai (per rosolare le melanzane): 15 tbsp (to brown the aubergines)
  1 vasetto: 1 jar
  1 ciuffo: 1 small bunch
  1 goccio: a splash
  5 rametti: 5 sprigs
  2-3 foglie: 2-3 leaves
  2 rametti: 2 sprigs
  145 g crudo (330 g cotto): 145 g raw (330 g cooked)
  per servire, facoltativo: to serve, optional
  1 bicchiere: 1 glass
  500-600 g: 500-600 g
  un piccolo pezzo: a small piece
  1 vaschetta da 250 g: 1 tub (250 g)
  1 cucchiaino abbondante: 1 heaped tsp
  1 foglia: 1 leaf
  2 bustine: 2 sachets
  1/4-1/2 cucchiaino: 1/4-1/2 tsp
  3 matasse: 3 nests
  1 panetto: 1 block
  1/2 cup (circa 1/2 cipolla media): 1/2 US cup (about 1/2 medium onion)
  1/2 cup: 1/2 US cup
  1/4 cup: 1/4 US cup
  8 piccole o 4 grandi per burrito: 8 small or 4 large burrito-size
  1 confezione da 250 g: 1 pack (250 g)
