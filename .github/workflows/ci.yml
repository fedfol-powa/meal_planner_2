name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Local Supabase Postgres started below, with the migrations of supabase/.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Local Supabase with Auth and the OAuth server (supabase/config.toml); no production credentials.
      - run: supabase start -x studio,storage-api,imgproxy,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit
      - run: supabase test db
      - run: npm ci
      - run: npm run typecheck
      # CI is set by GitHub Actions: database suites fail instead of being skipped.
      - run: npm test
      # Agents end to end: real OAuth tokens, the Worker under wrangler dev, disconnection through the app.
      - run: npm run build -w web
      - run: scripts/oauth/agents-e2e.sh
      # Password change on the local stack, backend and page: wrong current password, weak, expired session, other sessions.
      - run: scripts/password/password-stack.sh
      # Resets the database, then restores an export into it with the real CLI.
      - run: npm run test:drill -w server
      # After the drill: service SQL that empties the database (reset, launch), through the real prod-sql.ts.
      - run: npx vitest run -c vitest.destructive.config.ts
        env:
          CONTAINER_CLI: docker
      # Very last: drops schema app and the app roles, then rebuilds them in the order of the runbook.
      - run: npx vitest run -c vitest.destructive.config.ts
        env:
          FRESH_DATABASE: '1'
