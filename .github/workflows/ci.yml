name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Local Supabase Postgres started below, with the migrations of supabase/.
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase db start
      - run: supabase test db
      - run: npm ci
      - run: npm run typecheck
      # CI is set by GitHub Actions: database suites fail instead of being skipped.
      - run: npm test
      # Last: resets the database, then restores an export into it with the real CLI.
      - run: npm run test:drill -w server
