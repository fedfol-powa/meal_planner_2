  <script>
    "use strict";
    const messages = {
      "it-IT": {
        skip: "Vai al contenuto",
        lunch: "Pranzo", dinner: "Cena", ingredients: "Ingredienti", free: "Pasto libero",
        dayNavigation: "Giorni della settimana", week: "Pasti della settimana",
        menu: "Menu", recipes: "Ricettario", shopping: "Spesa", mainNavigation: "Navigazione principale",
        recipesIntro: "Le ricette di questa settimana.", viewInMenu: "Vedi nel menu", changeDay: "Cambia giorno",
        shoppingFor: "Per", noIngredients: "Non ci sono ingredienti da comprare per questo giorno."
      },
      "en-GB": {
        skip: "Skip to content",
        lunch: "Lunch", dinner: "Dinner", ingredients: "Ingredients", free: "Free meal",
        dayNavigation: "Days of the week", week: "Meals for the week",
        menu: "Menu", recipes: "Recipes", shopping: "Shopping", mainNavigation: "Main navigation",
        recipesIntro: "The recipes on this week’s menu.", viewInMenu: "View on the menu", changeDay: "Change day",
        shoppingFor: "For", noIngredients: "There are no ingredients to buy for this day."
      }
    };
    const menu = JSON.parse(document.getElementById("menu-data").textContent);
    const locale = menu.locale;
    const copy = messages[locale];
    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#icon-${name}"/></svg>`;
    const dateValue = value => new Date(`${value}T12:00:00`);
    const formatDate = (value, options) => new Intl.DateTimeFormat(locale, options).format(dateValue(value));
    document.documentElement.lang = locale;
    document.querySelectorAll("[data-copy]").forEach(element => { element.textContent = copy[element.dataset.copy]; });
    document.querySelector(".day-navigation").setAttribute("aria-label", copy.dayNavigation);
    document.querySelector(".bottom-navigation").setAttribute("aria-label", copy.mainNavigation);
    const monthTitle = formatDate(menu.startsOn, { month: "long", year: "numeric" });
    document.getElementById("calendar-month").textContent = monthTitle;



    const recipeImages = {
  "wrap-fagioli-neri-cheddar": "assets/recipe-images/wrap-fagioli-neri-cheddar.jpg",
  "pasta-zucca-salsiccia-robiola": "assets/recipe-images/pasta-zucca-salsiccia-robiola.jpg",
  "riso-ceci-spinaci-mandorle": "assets/recipe-images/riso-ceci-spinaci-mandorle.jpg",
  "pasta-robiola-speck": "assets/recipe-images/pasta-robiola-speck.jpg",
  "spaghetti-riso-tofu-verdure-wok": "assets/recipe-images/spaghetti-riso-tofu-verdure-wok.jpg",
  "pollo-corn-flakes": "assets/recipe-images/pollo-corn-flakes.jpg",
  "pasta-ricotta-zafferano": "assets/recipe-images/pasta-ricotta-zafferano.jpg",
  "pasta-crema-peperoni": "assets/recipe-images/pasta-crema-peperoni.jpg"
};

    function renderMeal(meal, date) {
      const title = escapeHtml(meal.name);
      const titleContent = meal.sourceUrl ? `<a class="recipe-link" href="${escapeHtml(meal.sourceUrl)}" target="_blank" rel="noopener noreferrer">${title} ${icon("arrow")}</a>` : title;
      const ingredientRows = meal.ingredients.map(item => `<li><span>${escapeHtml(item.name)}</span><span class="ingredient-quantity">${escapeHtml(item.quantity)}</span></li>`).join("");
      const headingId = `meal-${date}-${meal.type}`;
      const photo = recipeImages[meal.id];
      return `<article class="meal${meal.isFree ? " meal-free" : ""}" data-type="${meal.type}" aria-labelledby="${headingId}">
        ${photo ? `<div class="meal-media"><img class="meal-photo" src="${photo}" alt="" loading="${date === menu.startsOn ? "eager" : "lazy"}" decoding="async"><p class="meal-label">${copy[meal.type]}</p></div>` : `<div class="meal-heading"><p class="meal-label">${copy[meal.type]}</p></div>`}
        <div class="meal-content">
        ${meal.isFree ? `<span class="free-mark">${copy.free}</span>` : ""}
        <h3 id="${headingId}">${titleContent}</h3>
        ${meal.description ? `<p class="description">${escapeHtml(meal.description)}</p>` : ""}
        ${meal.details ? `<p class="meal-meta">${icon("clock")}<span>${escapeHtml(meal.details)}</span></p>` : ""}
        ${meal.sourceLabel ? `<p class="meal-source">${escapeHtml(meal.sourceLabel)}</p>` : ""}
        ${meal.ingredients.length ? `<details class="ingredients"><summary aria-label="${escapeHtml(`${copy.ingredients}: ${meal.name}`)}">${copy.ingredients}<span class="ingredient-count">(${meal.ingredients.length})</span></summary><ul class="ingredient-list">${ingredientRows}</ul></details>` : ""}
        </div>
      </article>`;
    }

    const weekTrack = document.getElementById("week");
    weekTrack.setAttribute("aria-label", copy.week);
    document.getElementById("day-links").innerHTML = menu.days.map((day, index) => `<a class="day-link" href="#day-${day.date}" ${index === 0 ? 'aria-current="location"' : ""} aria-label="${escapeHtml(formatDate(day.date, { weekday: "long", day: "numeric", month: "long" }))}"><span>${formatDate(day.date, { weekday: "short" }).replace(".", "").toLocaleUpperCase(locale)}</span><strong>${formatDate(day.date, { day: "numeric" })}</strong></a>`).join("");
    weekTrack.innerHTML = menu.days.map(day => `<section class="day" id="day-${day.date}" aria-labelledby="heading-${day.date}"><h2 class="day-title visually-hidden" id="heading-${day.date}">${formatDate(day.date, { weekday: "long", day: "numeric", month: "long" })}</h2>${day.meals.map(meal => renderMeal(meal, day.date)).join("")}</section>`).join("");

    const sections = [...document.querySelectorAll(".day")];
    const dayLinks = [...document.querySelectorAll(".day-link")];
    const viewPanels = { menu: document.getElementById("menu-view"), recipes: document.getElementById("recipes-view"), shopping: document.getElementById("shopping-view") };
    const navigationItems = [...document.querySelectorAll(".navigation-item")];
    Object.entries(viewPanels).forEach(([name, panel]) => panel.setAttribute("aria-label", copy[name]));
    const checkedIngredients = new Set();
    let activeView = "menu";
    let activeDayIndex = 0;
    let printing = false;
    function markActiveDay(index) {
      activeDayIndex = Math.max(0, Math.min(sections.length - 1, index));
      dayLinks.forEach((link, linkIndex) => {
        if (linkIndex === activeDayIndex) link.setAttribute("aria-current", "location");
        else link.removeAttribute("aria-current");
      });
    }
    function goToDay(index) {
      markActiveDay(index);
      weekTrack.scrollTo({ left: activeDayIndex * weekTrack.clientWidth, behavior: "instant" });
    }
    dayLinks.forEach((link, index) => link.addEventListener("click", event => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      goToDay(index);
    }));
    let scrollFrame = false;
    weekTrack.addEventListener("scroll", () => {
      if (printing || activeView !== "menu" || scrollFrame) return;
      scrollFrame = true;
      requestAnimationFrame(() => {
        if (!printing && activeView === "menu" && weekTrack.clientWidth) markActiveDay(Math.round(weekTrack.scrollLeft / weekTrack.clientWidth));
        scrollFrame = false;
      });
    }, { passive: true });
    weekTrack.addEventListener("keydown", event => {
      if (event.target !== weekTrack || !["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      event.preventDefault();
      const index = event.key === "Home" ? 0 : event.key === "End" ? sections.length - 1 : activeDayIndex + (event.key === "ArrowRight" ? 1 : -1);
      goToDay(index);
    });
    let trackWidth = weekTrack.clientWidth;
    new ResizeObserver(() => {
      const nextWidth = weekTrack.clientWidth;
      if (nextWidth !== trackWidth) {
        trackWidth = nextWidth;
        if (!printing && activeView === "menu" && nextWidth > 0) goToDay(activeDayIndex);
      }
    }).observe(weekTrack);
    function openLinkedDay() {
      const index = sections.findIndex(section => `#${section.id}` === location.hash);
      if (index >= 0) {
        activateView("menu");
        goToDay(index);
      } else {
        const requestedView = location.hash.slice(1);
        if (Object.hasOwn(viewPanels, requestedView)) activateView(requestedView);
        else if (!location.hash) activateView("menu");
      }
    }
    window.addEventListener("hashchange", openLinkedDay);

    function renderRecipeList() {
      const recipes = new Map();
      menu.days.forEach(day => day.meals.forEach(meal => {
        if (!meal.isFree && !recipes.has(meal.id)) recipes.set(meal.id, { meal, date: day.date });
      }));
      document.getElementById("recipe-list").innerHTML = [...recipes.values()].map(({ meal, date }) => {
        const photo = recipeImages[meal.id];
        return `<article class="recipe-row${photo ? " has-photo" : ""}">${photo ? `<img class="recipe-thumbnail" src="${photo}" alt="" loading="lazy" decoding="async">` : ""}<div class="recipe-content"><h2>${escapeHtml(meal.name)}</h2><p>${escapeHtml(meal.details)}</p><a href="#day-${date}">${copy.viewInMenu} ${icon("arrow")}</a></div></article>`;
      }).join("");
    }
    function renderShoppingList() {
      const day = menu.days[activeDayIndex];
      document.getElementById("shopping-context").textContent = `${copy.shoppingFor} ${formatDate(day.date, { weekday: "long", day: "numeric", month: "long" })}`;
      document.getElementById("shopping-list").innerHTML = day.meals.filter(meal => meal.ingredients.length).map(meal => `<section class="shopping-group"><p class="shopping-meal-type">${copy[meal.type]}</p><h2>${escapeHtml(meal.name)}</h2><ul class="shopping-items">${meal.ingredients.map((item, index) => {
        const key = `${day.date}-${meal.type}-${index}`;
        return `<li><label class="shopping-item"><input type="checkbox" data-ingredient="${key}" ${checkedIngredients.has(key) ? "checked" : ""}><span class="shopping-name">${escapeHtml(item.name)}</span><span class="shopping-quantity">${escapeHtml(item.quantity)}</span></label></li>`;
      }).join("")}</ul></section>`).join("") || `<p>${copy.noIngredients}</p>`;
    }
    document.getElementById("shopping-list").addEventListener("change", event => {
      const input = event.target;
      if (!input.matches("input[data-ingredient]")) return;
      if (input.checked) checkedIngredients.add(input.dataset.ingredient);
      else checkedIngredients.delete(input.dataset.ingredient);
    });
    function activateView(name) {
      activeView = name;
      Object.entries(viewPanels).forEach(([key, panel]) => { panel.hidden = key !== name; });
      navigationItems.forEach(link => {
        if (link.dataset.view === name) link.setAttribute("aria-current", "page");
        else link.removeAttribute("aria-current");
      });
      document.getElementById("calendar-month").textContent = name === "menu" ? monthTitle : copy[name];
      if (name === "shopping") renderShoppingList();
      if (name === "menu") {
        goToDay(activeDayIndex);
        requestAnimationFrame(() => { if (activeView === "menu" && !printing) goToDay(activeDayIndex); });
      }
    }

    const ingredientPanels = [...document.querySelectorAll(".ingredients")];
    let beforePrintState;
    window.addEventListener("beforeprint", () => {
      if (printing) return;
      beforePrintState = { panels: ingredientPanels.map(panel => panel.open), dayIndex: activeDayIndex, scrollTops: sections.map(section => section.scrollTop), viewScrollTops: Object.fromEntries(Object.entries(viewPanels).map(([name, panel]) => [name, panel.scrollTop])) };
      printing = true;
      ingredientPanels.forEach(panel => { panel.open = true; });
    });
    window.addEventListener("afterprint", () => {
      if (!beforePrintState) return;
      ingredientPanels.forEach((panel, index) => { panel.open = beforePrintState.panels[index]; });
      printing = false;
      if (activeView === "menu") goToDay(beforePrintState.dayIndex);
      sections.forEach((section, index) => { section.scrollTop = beforePrintState.scrollTops[index]; });
      Object.entries(viewPanels).forEach(([name, panel]) => { panel.scrollTop = beforePrintState.viewScrollTops[name]; });
      beforePrintState = undefined;
    });

    renderRecipeList();
    openLinkedDay();
  </script>
